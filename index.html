<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="robots" content="noindex">
<meta name="description" content="Muru & Saral travel, leave and remote-day planner">
<title>Muru &amp; Saral Planner</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
</head>
<body>
<header><div class="hwrap">
  <h1><span>Muru &amp; Saral</span>Planner</h1>
  <button class="ic" data-act="today" title="Today" aria-label="Go to today">◎</button>
  <button class="ic" data-act="settings" title="Settings" aria-label="Settings">⚙︎</button>
</div></header>
<main id="app"><div class="load">Loading planner…</div></main>
<button class="fab" data-act="add" aria-label="Add entry" hidden>+</button>
<div class="scrim" id="scrim" data-act="close" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
